name: Keep Render & MongoDB Atlas Awake

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging Second Brain backend on Render..."
          STATUS=$(curl -s -m 60 --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" https://secondbrain-pur4.onrender.com/api/v1/health || echo "000")
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ] 2>/dev/null; then
            echo "Successfully pinged backend and MongoDB Atlas!"
          else
            echo "Backend responded with status $STATUS (or is still waking up from a cold start)."
          fi
